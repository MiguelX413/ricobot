name: Build

on: ["push", "workflow_dispatch"]

jobs:
  build_main:
    name: Build for ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    if: "!contains(github.event.head_commit.message, '[ci skip]')"

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-26.04
            binary: dist/ricobot_mm.so
            symbols: dist/ricobot_mm.dbg
          - platform: win32
            runner: windows-latest
            binary: build/RelWithDebInfo/ricobot_mm.dll
            symbols: build/RelWithDebInfo/ricobot_mm.pdb

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Check C++ formatting (Linux)
        if: runner.os == 'Linux'
        run: clang-format-22 --dry-run --Werror ./*.cpp ./*.hpp

      - name: Read Linux runner image version
        if: runner.os == 'Linux'
        id: linux-image
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Cache Linux toolchain packages
        if: runner.os == 'Linux'
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/ricobot-apt
          key: apt-${{ matrix.runner }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/build.yml') }}-${{ steps.linux-image.outputs.version }}
          restore-keys: |
            apt-${{ matrix.runner }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/build.yml') }}-

      - name: Install Linux toolchain
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          if printf '#include <vector>\nint main() {}\n' |
              clang++-22 -m32 -x c++ - -o "$RUNNER_TEMP/ricobot-x86-probe"; then
            exit 0
          fi

          apt_cache="$RUNNER_TEMP/ricobot-apt"
          mkdir -p "$apt_cache/partial"

          # Keep the runner's Ubuntu mirror fallback and skip unrelated repositories.
          apt_options=(
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
            -o Dir::Etc::sourceparts=-
            -o "Dir::Cache::archives=$apt_cache"
          )
          echo "::group::Refresh Ubuntu package indexes"
          sudo apt-get "${apt_options[@]}" update --error-on=any
          echo "::endgroup::"
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends g++-multilib

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++-22
          -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Check C++ lint (Linux)
        if: runner.os == 'Linux'
        run: clang-tidy-22 -p build ./*.cpp

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake --build build --parallel

          mkdir -p dist
          cp build/ricobot_mm.so dist/
          cd dist
          objcopy --only-keep-debug ricobot_mm.so ricobot_mm.dbg
          objcopy --strip-debug --add-gnu-debuglink=ricobot_mm.dbg ricobot_mm.so

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build -A Win32
          cmake --build build --config RelWithDebInfo --parallel

      - uses: benjlevesque/short-sha@v5.0
        id: short-sha

      - name: Upload Binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ricobot-${{ matrix.platform }}-${{ steps.short-sha.outputs.sha }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

      - name: Upload Debug Symbols
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ricobot-dbgsym-${{ matrix.platform }}-${{ steps.short-sha.outputs.sha }}
          path: ${{ matrix.symbols }}
          if-no-files-found: error
